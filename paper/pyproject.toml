[project]
name = "fabric-paper-figures"
version = "0.1.0"
description = "Reproducible figures for the Fabric technical paper"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.6",
  "nbformat==5.10.4",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
]

[tool.uv]
package = false
