[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fabric-data-plane"
version = "0.1.0"
description = "Fabric inference ingress: local token verification, routing, and proxying."
requires-python = ">=3.12"

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "httpx==0.28.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "pyjwt[crypto]==2.10.1",
  "cryptography==44.0.0",
  "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["fabric_data_plane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI dependency injection requires calls such as Header() in defaults.
ignore = ["B008"]
