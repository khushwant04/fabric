[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "fabric-data-plane"
version = "0.1.0"
description = "Fabric inference ingress: local token verification, routing, and proxying."
requires-python = ">=3.12"

dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "python-json-logger==4.2.0",
  # Starlette parses multipart bodies only when this is installed, and the audio
  # endpoints are multipart. Without it those routes raise at request time rather
  # than at import, so the gap would not show until a caller sent audio.
  "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["fabric_data_plane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI dependency injection requires calls such as Header() in defaults.
ignore = ["B008"]
