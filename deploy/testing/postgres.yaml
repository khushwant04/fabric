# A PostgreSQL instance for verifying the packaging, and nothing else.
#
# This is NOT part of the product: Fabric does not ship a database. It exists so
# deploy/scripts/kind-e2e.sh can run the control plane in-cluster without depending on
# an external managed instance.
#
# The application role is created without BYPASSRLS on purpose. A superuser or a
# BYPASSRLS role ignores row-level security policies while the catalog still reports
# them as enabled, so a test running as one would report isolation that is not
# enforced.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # A script rather than plain SQL so the role's password can come from the environment.
  # The caller generates it per run, which keeps every password out of the repository
  # even for a throwaway database. psql's own variable quoting is used instead of shell
  # interpolation so the value cannot terminate the statement.
  init.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        -v app_password="$FABRIC_APP_PASSWORD" <<'SQL'
    CREATE ROLE fabric_app WITH
        LOGIN PASSWORD :'app_password'
        NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;
    GRANT USAGE, CREATE ON SCHEMA public TO fabric_app;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO fabric_app;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            # Generated per run by the caller, so no password for any database, however
            # throwaway, is carried in the repository.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: superuser-password}
            - name: FABRIC_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: app-password}
            - name: POSTGRES_DB
              value: fabric
            # The data directory lives under a subdirectory so an emptyDir mount does
            # not collide with the lost+found the image expects to be absent.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "fabric"]
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}
        - name: data
          emptyDir: {}
