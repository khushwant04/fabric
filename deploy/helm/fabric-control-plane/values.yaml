# Fabric control plane.
#
# Minimum required values:
#   database.existingSecret or database.url
#   signingKey.existingSecret or signingKey.value
#   jwt.issuer, auth0.issuer, auth0.audience, credentialPepper

replicas: 2

image:
  repository: fabric/control-plane
  tag: ""              # defaults to .Chart.AppVersion
  # Preferred in production. When set, workloads use repository@digest and ignore tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Optional account response cache. PostgreSQL remains authoritative; the deployed
# runtime advances durable account generations in the same mutation transaction.
# Existing installations can provide a Redis/Valkey URL in an existing Secret.
cache:
  existingSecret: ""
  existingSecretKey: redis-url
  passwordSecretKey: password
  ttlSeconds: 60
  internal:
    enabled: false
    image:
      repository: valkey/valkey
      digest: sha256:5d586b6d9574ce96954142cdca85f4903a0efdbd4d04d4fe27c9fb245cdf91d4
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

nameOverride: ""
fullnameOverride: ""

database:
  # SQLAlchemy async URL, e.g. postgresql+asyncpg://user:pass@host/db
  #
  # The role must not have BYPASSRLS or be a superuser, or the row-level security
  # policies are ignored while still reporting as enabled. The control plane logs an
  # error at startup when that is the case. Use
  # control-plane/scripts/create-app-role.sql to create a suitable role.
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

signingKey:
  # PEM-encoded RSA private key used to sign Fabric tokens. Not generated by this
  # chart: a key generated at install time would be replaced on upgrade, and every
  # token already issued and every data plane's cached JWKS would be invalidated.
  #
  #   openssl genrsa -out signing.pem 2048
  #   --set-file signingKey.value=signing.pem
  value: ""
  existingSecret: ""
  existingSecretKey: signing.pem

# Peppers credential hashes. Rotating it invalidates every stored API key and machine
# credential, so it belongs in a Secret that outlives the release.
credentialPepper: ""
credentialPepperExistingSecret: ""
credentialPepperExistingSecretKey: credential-pepper

jwt:
  # Issuer claim Fabric puts in its own tokens, and the URL data planes fetch JWKS
  # from, so it must be the address stamps actually reach.
  issuer: ""

auth0:
  issuer: ""
  audience: ""

appEnv: production
logLevel: INFO
systemAccountSlug: fabric-system

# Dedicated installation bootstrap. The administrator must log in through the
# configured Auth0 application; this grants membership, not a login bypass.
singleTenant:
  enabled: false
  accountId: ""
  accountSlug: fabric
  accountName: Fabric
  adminSubject: ""

migrations:
  # Runs the Alembic history as a pre-install and pre-upgrade hook, so the schema is
  # in place before any replica serves. The role needs DDL permission for this.
  enabled: true
  # Seeds the protected system account that owns managed capacity. Idempotent.
  seedSystemAccount: true
  backoffLimit: 2

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  # Stamps and customers reach the control plane from outside the cluster, so an
  # ingress is normally required. Left off by default because the host and TLS issuer
  # are environment-specific.
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 1, memory: 1Gi}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Exposure through an existing Istio ingress gateway. A cluster running the Istio addon
# has no IngressClass, so an Ingress object would be created and never served.
istio:
  enabled: false
  hosts: []
  # Selects the gateway workload. This is the AKS Istio addon's external gateway.
  gatewaySelector:
    istio: aks-istio-ingressgateway-external
  tls:
    # secret             terminate TLS at the gateway from a Kubernetes secret, and
    #                    redirect plaintext, which is the right shape for a public API
    #                    that issues credentials.
    # terminatedUpstream something in front already terminates TLS and reaches the
    #                    cluster over HTTP, leaving that hop unencrypted.
    mode: secret
    # A secret in the gateway's own namespace, not this one.
    credentialName: ""
  timeout: 120s

# Spread replicas over nodes so a node failure does not take the API with it.
spreadAcrossNodes: true

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraLabels: {}

# Optional self-hosted console. Authentication remains required; this chart reads
# the IdP client and session credentials from a Secret created by the administrator.
console:
  enabled: false
  replicas: 1
  image:
    repository: fabric/console
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Public HTTPS origin registered as the Auth0 application callback/logout origin.
  # No path or trailing slash. The callback is /auth/callback.
  baseUrl: ""
  # Defaults to this release's in-cluster control-plane Service.
  controlPlaneUrl: ""
  # Optional fixed gateway. Otherwise approved ready stamp endpoints are used.
  inferenceUrl: ""
  inferenceAllowedOrigins: []
  inference:
    # DNS suffixes administered by you, for stamp-created inference hostnames.
    # HTTPS on the default port is mandatory. Never use public shared suffixes.
    allowedDomains: []
  auth:
    existingSecret: ""
    keys:
      domain: auth0-domain
      clientId: auth0-client-id
      clientSecret: auth0-client-secret
      sessionSecret: auth0-session-secret
      audience: auth0-audience
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1, memory: 1Gi}
