# Fabric control plane.
#
# Minimum required values:
#   database.existingSecret or database.url
#   signingKey.existingSecret or signingKey.value
#   jwt.issuer, auth0.issuer, auth0.audience, credentialPepper

replicas: 2

image:
  repository: fabric/control-plane
  tag: ""              # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

database:
  # SQLAlchemy async URL, e.g. postgresql+asyncpg://user:pass@host/db
  #
  # The role must not have BYPASSRLS or be a superuser, or the row-level security
  # policies are ignored while still reporting as enabled. The control plane logs an
  # error at startup when that is the case. Use
  # control-plane/scripts/create-app-role.sql to create a suitable role.
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

signingKey:
  # PEM-encoded RSA private key used to sign Fabric tokens. Not generated by this
  # chart: a key generated at install time would be replaced on upgrade, and every
  # token already issued and every data plane's cached JWKS would be invalidated.
  #
  #   openssl genrsa -out signing.pem 2048
  #   --set-file signingKey.value=signing.pem
  value: ""
  existingSecret: ""
  existingSecretKey: signing.pem

# Peppers credential hashes. Rotating it invalidates every stored API key and machine
# credential, so it belongs in a Secret that outlives the release.
credentialPepper: ""
credentialPepperExistingSecret: ""
credentialPepperExistingSecretKey: credential-pepper

jwt:
  # Issuer claim Fabric puts in its own tokens, and the URL data planes fetch JWKS
  # from, so it must be the address stamps actually reach.
  issuer: ""

auth0:
  issuer: ""
  audience: ""

appEnv: production
logLevel: INFO
systemAccountSlug: fabric-system

migrations:
  # Runs the Alembic history as a pre-install and pre-upgrade hook, so the schema is
  # in place before any replica serves. The role needs DDL permission for this.
  enabled: true
  # Seeds the protected system account that owns managed capacity. Idempotent.
  seedSystemAccount: true
  backoffLimit: 2

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  # Stamps and customers reach the control plane from outside the cluster, so an
  # ingress is normally required. Left off by default because the host and TLS issuer
  # are environment-specific.
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 1, memory: 1Gi}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraLabels: {}
