# Fabric control plane.
#
# Minimum required values:
#   database.existingSecret or database.url
#   signingKey.existingSecret or signingKey.value
#   jwt.issuer, auth0.issuer, auth0.audience, credentialPepper

replicas: 2

image:
  repository: fabric/control-plane
  tag: ""              # defaults to .Chart.AppVersion
  # Preferred in production. When set, workloads use repository@digest and ignore tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Optional account response cache. PostgreSQL remains authoritative; the deployed
# runtime advances durable account generations in the same mutation transaction.
# Existing installations can provide a Redis/Valkey URL in an existing Secret.
cache:
  existingSecret: ""
  existingSecretKey: redis-url
  passwordSecretKey: password
  ttlSeconds: 60
  # Stamp/status/usage reads use a shorter TTL than deployment configuration.
  liveTtlSeconds: 3
  timeoutSeconds: 0.2
  maxConnections: 32
  maxValueBytes: 1048576
  internal:
    enabled: false
    # One disposable, shared Redis-compatible cache for all control-plane replicas.
    # HA deployments can point existingSecret at an externally managed Redis URL.
    maxMemoryMiB: 192
    nodeSelector: {}
    tolerations: []
    image:
      repository: valkey/valkey
      digest: sha256:5d586b6d9574ce96954142cdca85f4903a0efdbd4d04d4fe27c9fb245cdf91d4
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

nameOverride: ""
fullnameOverride: ""

database:
  # SQLAlchemy async URL, e.g. postgresql+asyncpg://user:pass@host/db
  #
  # The role must not have BYPASSRLS or be a superuser, or the row-level security
  # policies are ignored while still reporting as enabled. The control plane logs an
  # error at startup when that is the case. Use
  # control-plane/scripts/create-app-role.sql to create a suitable role.
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

signingKey:
  # PEM-encoded RSA private key used to sign Fabric tokens. Not generated by this
  # chart: a key generated at install time would be replaced on upgrade, and every
  # token already issued and every data plane's cached JWKS would be invalidated.
  #
  #   openssl genrsa -out signing.pem 2048
  #   --set-file signingKey.value=signing.pem
  value: ""
  existingSecret: ""
  existingSecretKey: signing.pem

# Peppers credential hashes. Rotating it invalidates every stored API key and machine
# credential, so it belongs in a Secret that outlives the release.
credentialPepper: ""
credentialPepperExistingSecret: ""
credentialPepperExistingSecretKey: credential-pepper

jwt:
  # Issuer claim Fabric puts in its own tokens, and the URL data planes fetch JWKS
  # from, so it must be the address stamps actually reach.
  issuer: ""

auth0:
  issuer: ""
  audience: ""

appEnv: production
logLevel: INFO
systemAccountSlug: fabric-system

# Dedicated installation bootstrap. The administrator must log in through the
# configured Auth0 application; this grants membership, not a login bypass.
singleTenant:
  enabled: false
  accountId: ""
  accountSlug: fabric
  accountName: Fabric
  adminSubject: ""

migrations:
  # Runs the Alembic history as a pre-install and pre-upgrade hook, so the schema is
  # in place before any replica serves. The role needs DDL permission for this.
  enabled: true
  # Seeds the protected system account that owns managed capacity. Idempotent.
  seedSystemAccount: true
  backoffLimit: 2

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  # Stamps and customers reach the control plane from outside the cluster, so an
  # ingress is normally required. Left off by default because the host and TLS issuer
  # are environment-specific.
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 1, memory: 1Gi}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Exposure through an existing Istio ingress gateway. A cluster running the Istio addon
# has no IngressClass, so an Ingress object would be created and never served.
istio:
  enabled: false
  hosts: []
  # Selects the gateway workload. This is the AKS Istio addon's external gateway.
  gatewaySelector:
    istio: aks-istio-ingressgateway-external
  tls:
    # secret             terminate TLS at the gateway from a Kubernetes secret, and
    #                    redirect plaintext, which is the right shape for a public API
    #                    that issues credentials.
    # terminatedUpstream something in front already terminates TLS and reaches the
    #                    cluster over HTTP, leaving that hop unencrypted.
    mode: secret
    # A secret in the gateway's own namespace, not this one.
    credentialName: ""
  timeout: 120s

# Spread replicas over nodes so a node failure does not take the API with it.
spreadAcrossNodes: true

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraLabels: {}

# Optional self-hosted console. Authentication remains required; this chart reads
# the IdP client and session credentials from a Secret created by the administrator.
console:
  enabled: false
  replicas: 1
  image:
    repository: fabric/console
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Public HTTPS origin registered as the Auth0 application callback/logout origin.
  # No path or trailing slash. The callback is /auth/callback.
  baseUrl: ""
  # Defaults to this release's in-cluster control-plane Service.
  controlPlaneUrl: ""
  # Address copied into stamp enrollment commands. Defaults to the HTTPS ingress
  # host when TLS is enabled; separate from the console's in-cluster API address.
  publicControlPlaneUrl: ""
  # Optional fixed gateway. Otherwise approved ready stamp endpoints are used; a stamp
  # gateway is preferred over this one for deployments on other stamps.
  inferenceUrl: ""
  # The edge gateway's public URL (ADR 0021). Defaults to https://<edge.ingress.host> when
  # the edge is enabled with TLS ingress. When set, the console sends every playground
  # request through the edge and shows it on Overview and Stamps.
  edgeInferenceUrl: ""
  inferenceAllowedOrigins: []
  inference:
    # DNS suffixes administered by you, for stamp-created inference hostnames.
    # HTTPS on the default port is mandatory. Never use public shared suffixes.
    allowedDomains: []
  auth:
    existingSecret: ""
    keys:
      domain: auth0-domain
      clientId: auth0-client-id
      clientSecret: auth0-client-secret
      sessionSecret: auth0-session-secret
      audience: auth0-audience
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1, memory: 1Gi}

# Edge gateway (ADR 0021, docs/edge-gateway.md): one public inference URL in front of every
# stamp. It verifies the caller's inference token locally, picks a stamp holding the
# requested model for the caller's account from a routing table it polls from this control
# plane, and streams the request to that stamp's gateway, which verifies the token again
# and serves it. Inference never passes through the control plane, and the edge keeps
# serving from its cached table while the control plane is down.
#
# The edge meters nothing and enforces no limits: stamps already do both, and counting
# twice would bill twice.
#
# Every stamp it routes to must expose its gateway over HTTPS and report inference_url
# (docs/stamp-native-endpoint.md).
edge:
  enabled: false
  replicas: 2
  image:
    # The data-plane image; the edge runs `python -m fabric_data_plane.edge`.
    repository: fabric/data-plane
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The routing-table credential, minted once with
  #   python -m app.cli create-edge-credential --name fabric-edge
  # and stored in a Secret you create. Required when the edge is enabled; the key itself
  # never goes in values.
  credential:
    existingSecret: ""
    existingSecretKey: api-key
  # Where the edge reaches this control plane for the routing table and signing keys.
  # Defaults to this release's in-cluster Service.
  controlPlaneUrl: ""
  # Issuer and JWKS URL tokens are verified against; default to jwt.issuer.
  jwtIssuer: ""
  jwksUrl: ""
  # CA bundle (a ConfigMap key) for stamp gateway certificates not signed by a public CA.
  # TLS to stamps is always verified.
  stampCaBundle:
    configMap: ""
    key: ca.crt
  # {"host:port": "ip:port"}: reach a stamp at another address while still verifying its
  # certificate name, e.g. over private peering.
  stampAddressOverrides: {}
  # Preferred region when a request does not send X-Fabric-Region.
  defaultRegion: ""
  pollIntervalSeconds: 10
  # Long generations stream for minutes: this bounds a silence between bytes, not a whole
  # response. Keep the ingress read timeout at least this long.
  readTimeoutSeconds: 600
  connectTimeoutSeconds: 5
  maxAttempts: 3
  stampFailureThreshold: 3
  stampRecoverySeconds: 30
  maxJsonBodyBytes: 16777216
  maxAudioUploadBytes: 26214400
  logLevel: INFO
  # The last good routing table is kept on disk so a pod restarted during a control-plane
  # outage still serves. Disabled uses an emptyDir: it survives container restarts but not
  # rescheduling, and a rescheduled pod stays unready until the control plane answers.
  # Enabled creates one ReadWriteOnce claim, so keep replicas at 1 or provide an RWX class.
  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 64Mi
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  ingress:
    enabled: false
    className: ""
    host: ""
    # Streaming needs response buffering off and long timeouts on most controllers, e.g.
    # for ingress-nginx:
    #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    #   nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    annotations: {}
    tls:
      enabled: true
      secretName: ""
  # Expose the edge through an existing Istio ingress gateway (e.g. the AKS Istio addon)
  # instead of an Ingress. hosts are the public inference hostnames; credentialName is a
  # TLS Secret in the ingress gateway's namespace.
  istio:
    enabled: false
    hosts: []
    # Defaults to the top-level istio.gatewaySelector.
    gatewaySelector: {}
    tls:
      credentialName: ""
    # 0s disables Istio's route timeout so long streamed generations are not cut off.
    timeout: 0s
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "2", memory: 512Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
