{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fabric-control-plane.serviceAccountName" . }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
  annotations:
    # Ordered ahead of the migration Job for the same reason as the Secret: hooks run
    # before ordinary resources, and a Job whose ServiceAccount does not exist is
    # rejected by the job controller with no pod and no useful error on the release.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# The control plane calls no Kubernetes API. It has no Role, and no token is mounted.
automountServiceAccountToken: false
{{- end }}
