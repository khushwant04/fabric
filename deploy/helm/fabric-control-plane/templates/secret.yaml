{{- include "fabric-control-plane.validate" . }}
{{- $needsSecret := or (and .Values.database.url (not .Values.database.existingSecret)) (or (and .Values.signingKey.value (not .Values.signingKey.existingSecret)) (and .Values.credentialPepper (not .Values.credentialPepperExistingSecret))) }}
{{- if $needsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fabric-control-plane.secretName" . }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall. The pepper hashes every stored credential and the signing key
    # backs every issued token: losing either is unrecoverable, not merely
    # inconvenient, so an uninstall must not take them with it.
    helm.sh/resource-policy: keep
    # Also a hook, and weighted ahead of the migration Job, because hooks run before
    # ordinary resources: the Job needs this Secret to exist, and without the
    # annotation the Job is created first and never gets a pod.
    #
    # No hook-delete-policy: deleting and recreating a Secret holding the signing key
    # would leave a window where a starting pod cannot mount it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.credentialPepper (not .Values.credentialPepperExistingSecret) }}
  {{ .Values.credentialPepperExistingSecretKey }}: {{ .Values.credentialPepper | quote }}
  {{- end }}
  {{- if and .Values.signingKey.value (not .Values.signingKey.existingSecret) }}
  {{ .Values.signingKey.existingSecretKey }}: |
{{ .Values.signingKey.value | indent 4 }}
  {{- end }}
{{- end }}
