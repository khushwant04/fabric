{{- if .Values.console.enabled }}
{{- $console := .Values.console -}}
{{- $name := printf "%s-console" (include "fabric-control-plane.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $authSecret := required "console.auth.existingSecret is required; console credentials must come from an existing Secret" $console.auth.existingSecret -}}
{{- $baseUrl := required "console.baseUrl is required for sign-in callbacks and request origin validation" $console.baseUrl -}}
{{- $publicControlPlaneUrl := $console.publicControlPlaneUrl | default "" -}}
{{- if and (not $publicControlPlaneUrl) .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.host -}}
{{- $publicControlPlaneUrl = printf "https://%s" .Values.ingress.host -}}
{{- end -}}
{{- $hostnamePattern := "[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*" -}}
{{- if not (regexMatch (printf "^https://%s(:[0-9]{1,5})?$" $hostnamePattern) $baseUrl) }}
{{- fail "console.baseUrl must be an HTTPS origin without a path or trailing slash" -}}
{{- end }}
{{- $port := trimPrefix ":" (regexFind ":[0-9]+$" $baseUrl) -}}
{{- if and $port (or (lt (int $port) 1) (gt (int $port) 65535)) }}
{{- fail "console.baseUrl port must be between 1 and 65535" -}}
{{- end }}
{{- if and $console.ingress.enabled $port }}
{{- fail "console.baseUrl must use a DNS hostname without a port when console.ingress.enabled=true" -}}
{{- end }}
{{- $singleTenant := .Values.singleTenant | default dict -}}
{{- $accountId := "" -}}
{{- if $singleTenant.enabled }}
{{- $accountId = required "singleTenant.accountId is required when the single-tenant console is enabled" $singleTenant.accountId -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ $console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-console
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: console
        app.kubernetes.io/part-of: fabric
      annotations:
        checksum/config: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s|%s|%s" $baseUrl $console.controlPlaneUrl $console.inferenceUrl $accountId (toJson $console.inferenceAllowedOrigins) (toJson $console.inference.allowedDomains) $authSecret (toJson $console.auth.keys) $publicControlPlaneUrl .Values.jwt.issuer | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          {{- if $console.image.digest }}
          image: {{ printf "%s@%s" $console.image.repository $console.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" $console.image.repository ($console.image.tag | default .Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ $console.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: APP_BASE_URL
              value: {{ $baseUrl | quote }}
            - name: FABRIC_CONTROL_PLANE_URL
              value: {{ $console.controlPlaneUrl | default (printf "http://%s:%v" (include "fabric-control-plane.fullname" .) .Values.service.port) | quote }}
            {{- if $publicControlPlaneUrl }}
            - name: FABRIC_CONTROL_PLANE_PUBLIC_URL
              value: {{ $publicControlPlaneUrl | quote }}
            {{- end }}
            - name: FABRIC_CONTROL_PLANE_JWT_ISSUER
              value: {{ .Values.jwt.issuer | quote }}
            {{- if $accountId }}
            - name: FABRIC_SINGLE_TENANT_ACCOUNT_ID
              value: {{ $accountId | quote }}
            {{- end }}
            {{- if $console.inferenceUrl }}
            - name: FABRIC_INFERENCE_URL
              value: {{ $console.inferenceUrl | quote }}
            {{- end }}
            {{- if $console.inferenceAllowedOrigins }}
            - name: FABRIC_INFERENCE_ALLOWED_ORIGINS
              value: {{ join "," $console.inferenceAllowedOrigins | quote }}
            {{- end }}
            {{- if $console.inference.allowedDomains }}
            - name: FABRIC_INFERENCE_ALLOWED_DOMAINS
              value: {{ join "," $console.inference.allowedDomains | quote }}
            {{- end }}
            {{- range $envName, $secretKey := dict "AUTH0_DOMAIN" $console.auth.keys.domain "AUTH0_CLIENT_ID" $console.auth.keys.clientId "AUTH0_CLIENT_SECRET" $console.auth.keys.clientSecret "AUTH0_SECRET" $console.auth.keys.sessionSecret "AUTH0_AUDIENCE" $console.auth.keys.audience }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ required (printf "console.auth.keys key for %s is required" $envName) $secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml $console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ $console.service.type }}
  selector:
    app.kubernetes.io/name: fabric-console
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $console.service.port }}
      targetPort: http
{{- if $console.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with $console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $console.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $console.ingress.tls.enabled }}
  tls:
    - hosts: [{{ trimPrefix "https://" $baseUrl | quote }}]
      secretName: {{ required "console.ingress.tls.secretName is required when TLS is enabled" $console.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ trimPrefix "https://" $baseUrl | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $console.service.port }}
{{- end }}
{{- end }}
