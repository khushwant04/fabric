{{- if .Values.edge.enabled }}
{{- $edge := .Values.edge -}}
{{- $name := printf "%s-edge" (include "fabric-control-plane.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $credential := required "edge.credential.existingSecret is required: mint the key with `python -m app.cli create-edge-credential` and store it in a Secret" $edge.credential.existingSecret -}}
{{- $issuer := $edge.jwtIssuer | default .Values.jwt.issuer -}}
{{- $controlPlane := $edge.controlPlaneUrl | default (printf "http://%s:%v" (include "fabric-control-plane.fullname" .) .Values.service.port) -}}
{{- if and $edge.ingress.enabled (not $edge.ingress.host) }}
{{- fail "edge.ingress.host is required when the edge ingress is enabled" -}}
{{- end }}
{{- if and $edge.persistence.enabled (gt (int $edge.replicas) 1) (eq $edge.persistence.accessMode "ReadWriteOnce") }}
{{- fail "edge.persistence with ReadWriteOnce supports one replica; set edge.replicas=1 or an RWX accessMode" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  replicas: {{ $edge.replicas }}
  selector:
    matchLabels:
      # Distinct from the control plane's selector, so neither Service selects the other's
      # pods.
      app.kubernetes.io/name: fabric-edge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-edge
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: fabric
      annotations:
        checksum/config: {{ printf "%s|%s|%s|%s|%s" $controlPlane $issuer (toJson $edge.stampAddressOverrides) (toJson $edge.stampCaBundle) $credential | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
        {{- with $edge.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: edge
          {{- if $edge.image.digest }}
          image: {{ printf "%s@%s" $edge.image.repository $edge.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" $edge.image.repository ($edge.image.tag | default .Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ $edge.image.pullPolicy }}
          command: ["python", "-m", "fabric_data_plane.edge"]
          env:
            - name: FABRIC_EDGE_HOST
              value: 0.0.0.0
            - name: FABRIC_EDGE_PORT
              value: "8080"
            # Bound pod-wide so Prometheus and the kubelet reach it; no Service publishes it.
            # The routing summary there carries no account ids, aliases or credentials.
            - name: FABRIC_EDGE_ADMIN_HOST
              value: 0.0.0.0
            - name: FABRIC_EDGE_ADMIN_PORT
              value: "8081"
            - name: FABRIC_EDGE_LOG_LEVEL
              value: {{ $edge.logLevel | quote }}
            - name: FABRIC_EDGE_CONTROL_PLANE_URL
              value: {{ $controlPlane | quote }}
            - name: FABRIC_EDGE_API_KEY_FILE
              value: /etc/fabric/edge/{{ $edge.credential.existingSecretKey }}
            - name: FABRIC_EDGE_JWT_ISSUER
              value: {{ $issuer | quote }}
            {{- if $edge.jwksUrl }}
            - name: FABRIC_EDGE_JWKS_URL
              value: {{ $edge.jwksUrl | quote }}
            {{- end }}
            - name: FABRIC_EDGE_TABLE_CACHE_PATH
              value: /var/lib/fabric-edge/routing-table.json
            {{- if $edge.stampCaBundle.configMap }}
            - name: FABRIC_EDGE_STAMP_CA_BUNDLE
              value: /etc/fabric/stamp-ca/{{ $edge.stampCaBundle.key }}
            {{- end }}
            {{- if $edge.stampAddressOverrides }}
            - name: FABRIC_EDGE_STAMP_ADDRESS_OVERRIDES
              value: {{ toJson $edge.stampAddressOverrides | quote }}
            {{- end }}
            {{- if $edge.defaultRegion }}
            - name: FABRIC_EDGE_DEFAULT_REGION
              value: {{ $edge.defaultRegion | quote }}
            {{- end }}
            - name: FABRIC_EDGE_POLL_INTERVAL_SECONDS
              value: {{ $edge.pollIntervalSeconds | quote }}
            - name: FABRIC_EDGE_READ_TIMEOUT_SECONDS
              value: {{ $edge.readTimeoutSeconds | quote }}
            - name: FABRIC_EDGE_CONNECT_TIMEOUT_SECONDS
              value: {{ $edge.connectTimeoutSeconds | quote }}
            - name: FABRIC_EDGE_MAX_ATTEMPTS
              value: {{ $edge.maxAttempts | quote }}
            - name: FABRIC_EDGE_STAMP_FAILURE_THRESHOLD
              value: {{ $edge.stampFailureThreshold | quote }}
            - name: FABRIC_EDGE_STAMP_RECOVERY_SECONDS
              value: {{ $edge.stampRecoverySeconds | quote }}
            - name: FABRIC_EDGE_MAX_JSON_BODY_BYTES
              value: {{ $edge.maxJsonBodyBytes | int64 | quote }}
            - name: FABRIC_EDGE_MAX_AUDIO_UPLOAD_BYTES
              value: {{ $edge.maxAudioUploadBytes | int64 | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 20
          # Ready once it holds a routing table (from the control plane or its cache) and
          # verification keys. Neither depends on the control plane being up right now.
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml $edge.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: credential
              mountPath: /etc/fabric/edge
              readOnly: true
            - name: table-cache
              mountPath: /var/lib/fabric-edge
            {{- if $edge.stampCaBundle.configMap }}
            - name: stamp-ca
              mountPath: /etc/fabric/stamp-ca
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credential
          secret:
            secretName: {{ $credential }}
            defaultMode: 0400
            items:
              - key: {{ $edge.credential.existingSecretKey }}
                path: {{ $edge.credential.existingSecretKey }}
        - name: table-cache
          {{- if $edge.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $edge.persistence.size }}
          {{- end }}
        {{- if $edge.stampCaBundle.configMap }}
        - name: stamp-ca
          configMap:
            name: {{ $edge.stampCaBundle.configMap }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with $edge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $edge.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
  {{- with $edge.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $edge.service.type }}
  selector:
    app.kubernetes.io/name: fabric-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # Inference only. The admin port is never published.
    - name: http
      port: {{ $edge.service.port }}
      targetPort: http
      protocol: TCP
{{- if $edge.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  accessModes: [{{ $edge.persistence.accessMode }}]
  {{- with $edge.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $edge.persistence.size }}
{{- end }}
{{- if $edge.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
  {{- with $edge.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $edge.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $edge.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $edge.ingress.host | quote }}]
      secretName: {{ required "edge.ingress.tls.secretName is required when edge TLS is enabled" $edge.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $edge.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $edge.service.port }}
{{- end }}
{{- end }}
