{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fabric-stamp.serviceAccountName" . }}
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No token by default. Roles are bound to this account only for what the agent actually
# does: declaring FabricModelDeployment intent when an operator runs, and reading nodes and
# pods when stamp.measureCapacity asks it to report this stamp's GPU capacity. Both are
# opt-in, and the pod overrides this field when either applies.
automountServiceAccountToken: false
{{- end }}
