{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fabric-stamp.serviceAccountName" . }}
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role or ClusterRole is bound. The agent creates no Kubernetes resources, so it
# needs no API permissions at all; granting any would exceed what the code does.
automountServiceAccountToken: false
{{- end }}
