{{- if .Values.operator.enabled }}
apiVersion: apps/v1
# A separate Deployment, not a container in the stamp pod. The operator needs a
# different ServiceAccount from the agent, and a pod has only one: sharing it would
# hand the agent the operator's Kubernetes permissions and defeat the split.
kind: Deployment
metadata:
  name: {{ include "fabric-stamp.fullname" . }}-operator
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  # One replica and no leader election. Reconciliation is idempotent, but two writers
  # would still fight over the same ConfigMap and churn every mounted copy.
  replicas: 1
  selector:
    matchLabels:
      {{- include "fabric-stamp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "fabric-stamp.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "fabric-stamp.fullname" . }}-operator
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "fabric-stamp.agentImage" . | quote }}
          imagePullPolicy: {{ .Values.image.agent.pullPolicy }}
          command: ["/usr/local/bin/fabric-operator"]
          args:
            - --namespace={{ .Release.Namespace }}
            - --configmap={{ .Values.operator.configMapName }}
            - --interval={{ .Values.operator.interval }}
            - --router-status-url=http://{{ include "fabric-stamp.fullname" . }}-router-status:8082
            - --rollout-ready-timeout={{ .Values.operator.rollout.readyTimeout }}
            - --rollout-max-parallel={{ .Values.operator.rollout.maxParallel }}
            {{- if not .Values.operator.rollout.autoRollback }}
            - --rollout-auto-rollback=false
            {{- end }}
            {{- with .Values.operator.managedModelHost }}
            {{- if .image }}
            - --model-host-image={{ .image }}
            {{- with .modelRef }}
            - {{ printf "--model-host-model=%s" . | quote }}
            {{- end }}
            {{- with .servedName }}
            - {{ printf "--model-host-served-name=%s" . | quote }}
            {{- end }}
            - --model-host-gpus={{ .gpus }}
            - --model-host-max-model-len={{ .maxModelLen }}
            - --model-host-max-num-seqs={{ .maxNumSeqs }}
            - --model-host-gpu-memory-utilization={{ .gpuMemoryUtilization }}
            - --model-host-dtype={{ .dtype }}
            - {{ printf "--model-host-service-account=%s" (include "fabric-stamp.modelHostServiceAccount" $) | quote }}
            {{- range .imagePullSecrets }}
            - {{ printf "--model-host-image-pull-secret=%s" .name | quote }}
            {{- end }}
            {{- with .huggingFace.existingSecret }}
            - {{ printf "--model-host-hf-secret=%s" . | quote }}
            - {{ printf "--model-host-hf-token-key=%s" $.Values.operator.managedModelHost.huggingFace.tokenKey | quote }}
            {{- end }}
            {{- if .textOnly }}
            - --model-host-text-only
            {{- with .textOnlyModels }}
            - {{ printf "--model-host-text-only-models=%s" (join "," .) | quote }}
            {{- end }}
            {{- end }}
            {{- with .toolCalling }}
            {{- if eq .modelDefaults false }}
            - --model-host-tool-calling-model-defaults=false
            {{- end }}
            {{- range $model, $parser := .modelParsers }}
            - {{ printf "--model-host-tool-call-parser=%s=%s" $model $parser | quote }}
            {{- end }}
            {{- end }}
            {{- with .resources }}
            {{- with .requests }}
            {{- with .cpu }}
            - {{ printf "--model-host-cpu-request=%s" (toString .) | quote }}
            {{- end }}
            {{- with .memory }}
            - {{ printf "--model-host-memory-request=%s" (toString .) | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - --model-host-port={{ .port }}
            {{- if .enforceEager }}
            - --model-host-enforce-eager
            {{- end }}
            {{- if gt (int .kernel.blockV) 0 }}
            - --model-host-kernel-block-v={{ .kernel.blockV }}
            {{- end }}
            {{- if gt (int .kernel.numWarps) 0 }}
            - --model-host-kernel-num-warps={{ .kernel.numWarps }}
            {{- end }}
            - --model-host-cache-mode={{ .cache.mode }}
            {{- with .cache.hostPath }}
            - --model-host-cache-host-path={{ . }}
            {{- end }}
            {{- with .cache.claim }}
            - --model-host-cache-claim={{ . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.gpu.runtimeClassName }}
            - --model-host-runtime-class={{ . }}
            {{- end }}
            {{- range $key, $value := .Values.gpu.nodeSelector }}
            - --model-host-node-selector={{ $key }}={{ $value }}
            {{- end }}
            {{- range .Values.gpu.tolerations }}
            - --model-host-toleration={{ .key }}{{ if .value }}={{ .value }}{{ end }}:{{ .effect | default "NoSchedule" }}
            {{- end }}
            {{- if .Values.gpu.spreadAcrossNodes }}
            - --model-host-spread-across-nodes
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
