{{- if .Values.istio.enabled }}
{{- if not .Values.istio.hosts }}
{{- fail "istio.hosts is required when istio.enabled is set: a gateway with no hostname matches nothing" -}}
{{- end }}
{{- if not .Values.istio.gatewaySelector }}
{{- fail "istio.gatewaySelector is required when istio.enabled is set: without it the Gateway selects no workload and Istio rejects it" -}}
{{- end }}
{{- if and (eq .Values.istio.tls.mode "secret") (not .Values.istio.tls.credentialName) }}
{{- fail "istio.tls.credentialName is required when istio.tls.mode is secret" -}}
{{- end }}
{{- if not (has .Values.istio.tls.mode (list "secret" "terminatedUpstream")) }}
{{- fail "istio.tls.mode must be secret or terminatedUpstream" -}}
{{- end }}
# Exposes the data plane's inference listener, and only that listener. The
# administrative listener the collector drains is not in this Service at all: it is
# reached over the pod's own loopback, so there is nothing here that could route to it.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "fabric-stamp.fullname" . }}-inference
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gatewaySelector | nindent 4 }}
  servers:
    {{- if eq .Values.istio.tls.mode "secret" }}
      # Named after the release. Several Gateway resources bind the same shared ingress
      # workload, and Istio merges the servers they declare for a port. Two of them
      # naming that port identically merge into one, and the second host silently loses
      # its plaintext server: the redirect answered 502 while HTTPS kept working, because
      # TLS filter chains are keyed by SNI and plain HTTP has nothing to key on.
    - port:
        number: 443
        name: {{ include "fabric-stamp.fullname" . }}-https
        protocol: HTTPS
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tls.credentialName }}
    - port:
        number: 80
        name: {{ include "fabric-stamp.fullname" . }}-http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
      # Inference requests carry a bearer token, so plaintext is refused rather than
      # served and hoped about.
      tls:
        httpsRedirect: true
    {{- else }}
    # terminatedUpstream: something in front already terminates TLS and reaches this
    # cluster over HTTP, leaving that hop unencrypted across the public internet with
    # the caller's token on it.
    - port:
        number: 80
        name: {{ include "fabric-stamp.fullname" . }}-http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
    {{- end }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "fabric-stamp.fullname" . }}-inference
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.istio.hosts | nindent 4 }}
  gateways:
    - {{ include "fabric-stamp.fullname" . }}-inference
  http:
    - route:
        - destination:
            host: {{ include "fabric-stamp.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      # Generous on purpose. A long generation, or a stream held open while tokens are
      # produced, outlives any timeout chosen for an ordinary API, and cutting it off
      # mid-answer would bill the caller for work they never received.
      timeout: {{ .Values.istio.timeout }}
{{- end }}
