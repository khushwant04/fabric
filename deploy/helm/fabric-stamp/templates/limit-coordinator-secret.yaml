{{- include "fabric-stamp.validate" . -}}
{{- if and .Values.dataPlane.limits.shared.enabled (not .Values.dataPlane.limits.shared.existingSecret) }}
{{- $name := include "fabric-stamp.limitSecretName" . -}}
{{- $key := .Values.dataPlane.limits.shared.existingSecretKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := .Values.dataPlane.limits.shared.token -}}
{{- if and (not $token) $existing (index $existing.data $key) -}}
{{- $token = (index $existing.data $key | b64dec) -}}
{{- end -}}
{{- if not $token -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
  annotations:
    # The token authenticates every gateway replica to the stamp-local coordinator. Preserve it
    # through uninstall/reinstall for the same reason as the retained local state.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $key }}: {{ $token | quote }}
{{- end }}
