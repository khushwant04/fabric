{{- if .Values.operator.enabled }}
{{- if .Values.operator.installCRD }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricmodeldeployments.fabric.khushwant.dev
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
  annotations:
    # Kept when the release is uninstalled: deleting a CRD deletes every custom
    # resource of that kind, and an accidental uninstall would silently withdraw
    # every deployment this cluster serves.
    helm.sh/resource-policy: keep
spec:
  group: fabric.khushwant.dev
  scope: Namespaced
  names:
    kind: FabricModelDeployment
    listKind: FabricModelDeploymentList
    plural: fabricmodeldeployments
    singular: fabricmodeldeployment
    shortNames:
      - fmd
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # Status is a subresource so the operator can write its observations without
        # holding permission to change the intent it was given. The agent declares
        # spec, the operator reports status, and neither can rewrite the other's half.
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.modelAlias
        - name: Account
          type: string
          jsonPath: .spec.accountId
        - name: Applied
          type: string
          jsonPath: .status.conditions[?(@.type=="Applied")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |
            One model deployment the Fabric control plane has placed on this stamp.
            The agent creates it; the operator renders the data plane's configuration
            from it. Editing it by hand is not useful: the agent reconciles it back to
            what the control plane placed.
          required: [spec]
          properties:
            spec:
              type: object
              # No additionalProperties here: a structural schema forbids combining it
              # with properties. The API server prunes unknown fields instead, so a
              # mistyped field is dropped rather than stored and silently ignored by
              # the operator.
              required: [deploymentId, accountId, modelAlias, upstreamUrl]
              properties:
                deploymentId:
                  type: string
                  description: Control-plane deployment identifier.
                  minLength: 1
                  maxLength: 64
                accountId:
                  type: string
                  description: |
                    Account that owns this deployment. On a managed stamp this is a
                    customer account, not the account that owns the stamp, and the
                    data plane authorizes against it.
                  minLength: 1
                  maxLength: 64
                modelAlias:
                  type: string
                  description: Name callers use, which need not match the release.
                  minLength: 1
                  maxLength: 200
                upstreamUrl:
                  type: string
                  description: Model host the data plane proxies to.
                  minLength: 1
                upstreamModel:
                  type: string
                  description: Model name the upstream host expects.
                  maxLength: 200
                kernelMode:
                  type: string
                  description: |
                    Which decode kernel the model host should use. "fabric" selects the
                    Fabric substitution, "standard" the server's own, and "auto" leaves
                    the choice to the platform, which currently means the server's own.
                  enum: [auto, fabric, standard]
                replicas:
                  type: integer
                  description: |
                    How many model-host replicas serve this deployment. Each replica is
                    one pod holding one GPU and the data plane balances across them; a
                    fleet is expressed by asking for more than one. Absent means one.
                  minimum: 1
                  maximum: 32
                strategy:
                  type: string
                  description: |
                    How the data plane balances across the deployment's backends.
                    "least_in_flight" sends each request to the backend carrying the
                    fewest in-flight requests, "round_robin" cycles them, "session_affinity"
                    pins a session key to a stable backend, and "weighted" spreads
                    proportionally to per-backend weight. Absent means least_in_flight.
                  enum: [least_in_flight, round_robin, session_affinity, weighted]
                gpuCount:
                  type: integer
                  description: |
                    How many GPUs one replica needs, which becomes the model-host
                    container's nvidia.com/gpu limit. The control plane admitted this
                    placement by comparing replicas x this against what the stamp
                    reported, so the pod asks for the number it was admitted for. Absent
                    means the count the operator was configured with.
                  minimum: 1
                  maximum: 8
                generation:
                  type: integer
                  description: Control-plane generation this declaration came from.
                  minimum: 0
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                readyReplicas:
                  type: integer
                  minimum: 0
                unavailableReplicas:
                  type: integer
                  minimum: 0
                rollout:
                  type: object
                  properties:
                    phase:
                      type: string
                      enum: [Serving, Preparing, Draining, Failed]
                    targetGeneration:
                      type: integer
                    activeRelease:
                      type: string
                    activeWorkload:
                      type: string
                    candidateRelease:
                      type: string
                    candidateWorkload:
                      type: string
                    startedAt:
                      type: string
                    cutoverRevision:
                      type: string
                    drainingBackendIds:
                      type: array
                      items:
                        type: string
                    drainingWorkload:
                      type: string
                    failedGeneration:
                      type: integer
                    rollback:
                      type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
{{- end }}
{{- end }}
