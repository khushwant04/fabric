{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fabric-stamp.fullname" . }}
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fabric-stamp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the inference port is reachable. The administrative port is omitted, so
    # even a caller inside the cluster cannot drain usage or read internal state.
    - ports:
        - port: inference
          protocol: TCP
      {{- with .Values.networkPolicy.allowedNamespaces }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
    {{- if .Values.dataPlane.limits.shared.enabled }}
    # Atomic account admission is private to gateway replicas carrying this stamp's labels and
    # coordinator token. It is never published by the inference Service or public ingress.
    - ports:
        - port: limits
          protocol: TCP
      from:
        # Current coordinator-owning gateway pod.
        - podSelector:
            matchLabels:
              {{- include "fabric-stamp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: stamp
        # Reserved caller identity for a future horizontally scaled gateway Deployment. It is a
        # source only; the limits Service destination remains component=stamp.
        - podSelector:
            matchLabels:
              {{- include "fabric-stamp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
    {{- end }}
    {{- if and .Values.operator.enabled .Values.operator.managedModelHost.image }}
    # Rollout acknowledgement exposes only loaded route revision and active backend
    # counts. It is reachable solely from the operator pod, never through public ingress.
    - ports:
        - port: router-status
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "fabric-stamp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
    {{- end }}
  # Egress is unrestricted: the agent and collector call the control plane
  # outbound, and the data plane calls the model host. Restricting it needs the
  # customer's own CIDRs and belongs in their policy, not this chart's default.
{{- end }}
