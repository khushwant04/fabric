{{- if and .Values.enrollment.token (not .Values.enrollment.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fabric-stamp.enrollmentSecretName" . }}
  labels:
    {{- include "fabric-stamp.labels" . | nindent 4 }}
  annotations:
    # The token is single use. Once the stamp holds credentials this Secret is dead
    # weight and should be deleted; the agent will not use it again.
    fabric.io/single-use: "true"
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.enrollment.existingSecretKey }}: {{ .Values.enrollment.token | quote }}
{{- end }}
