# Dependency updates are grouped per component and ecosystem so that each week
# produces at most one pull request per component rather than one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directories: [/control-plane, /data-plane]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  # torch, triton and vLLM are pinned to the toolchain the committed benchmark
  # artifacts were produced with; moving them is a deliberate, measured change.
  - package-ecosystem: pip
    directories: [/runtime, /serving]
    schedule: { interval: monthly }
    # One pull request for both directories: separate ones edit neighbouring lines of the
    # same pyproject.toml and conflict as soon as the first is merged.
    groups:
      research-tooling: { patterns: ["*"] }
    ignore:
      - dependency-name: torch
      - dependency-name: triton
      - dependency-name: vllm
      - dependency-name: flash-linear-attention

  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /v1
    schedule: { interval: weekly }
    groups:
      console: { patterns: ["*"] }
    ignore:
      # typescript-eslint (through eslint-config-next) supports TypeScript 6 at most;
      # TypeScript 7 makes lint crash. Take a new major once it is supported.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-config-next's eslint-plugin-import declares peer support up to ESLint 9.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /deploy/images
    schedule: { interval: weekly }
    ignore:
      # The model-host and kernel-bench images carry the same pinned vLLM as serving/
      # (see above); a new vLLM changes the kernels the benchmarks measured.
      - dependency-name: vllm/vllm-openai
