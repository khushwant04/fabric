name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [control-plane, data-plane]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test control plane
        if: matrix.component == 'control-plane'
        run: uv run --extra dev pytest -q
      - name: Test data plane
        if: matrix.component == 'data-plane'
        run: uv run --with-editable . --with 'pytest==8.3.4' --with 'pytest-asyncio==0.24.0' pytest -q
      - name: Lint
        run: uv run --with 'ruff==0.8.4' ruff check .

  # Row-level security is a no-op on SQLite, so the isolation guarantees are only
  # proven here: PostgreSQL, with the application connected as a role that has
  # neither SUPERUSER nor BYPASSRLS.
  control-plane-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabric_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: control-plane
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create the restricted application role
        run: |
          psql -h localhost -U postgres -d fabric_test -v ON_ERROR_STOP=1 \
            -v password="'fabric-ci'" -f scripts/create-app-role.sql
          psql -h localhost -U postgres -d fabric_test -tA -c \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'fabric_app'" \
            | grep -qx f
      - name: Test control plane on PostgreSQL
        env:
          FABRIC_TEST_DATABASE_URL: postgresql+asyncpg://fabric_app:fabric-ci@localhost:5432/fabric_test
        run: uv run --extra dev pytest -q -rs

  # Kernel and vLLM-integration tests on CPU builds of the pinned torch/triton.
  # GPU-only cases skip themselves; vLLM itself is not installed (multi-GB CUDA
  # wheels), so the serving tests that need it skip too.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_INDEX: https://download.pytorch.org/whl/cpu
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test runtime kernels and harness
        working-directory: runtime
        run: uv run --python 3.12 --with-editable . --with 'pytest==8.3.4' pytest -q
      - name: Test serving integration
        working-directory: serving
        run: |
          uv run --python 3.12 --no-project --with 'torch==2.8.0' --with 'triton==3.4.0' \
            --with-editable ../runtime --with 'pytest==8.3.4' \
            env PYTHONPATH=. pytest -q
      - name: Lint
        run: |
          (cd runtime && uv run --no-project --with 'ruff==0.8.4' ruff check .)
          (cd serving && uv run --no-project --with 'ruff==0.8.4' ruff check .)

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v1/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npx next typegen
          npx tsc --noEmit
      - name: Test account isolation, deployment actions, and observed state
        run: |
          for test_file in tests/*.test.mjs; do
            node "$test_file"
          done
          npx tsc --target es2022 --module commonjs --moduleResolution node \
            --esModuleInterop --skipLibCheck --outDir /tmp/fabric-console-tests tests/*.test.ts
          for test_file in /tmp/fabric-console-tests/tests/*.test.js; do
            node "$test_file"
          done
      - name: Build the standalone console image
        working-directory: .
        run: docker build -f deploy/images/console.Dockerfile -t fabric/console:ci .

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chart test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Lint charts
        run: |
          helm lint deploy/helm/fabric-control-plane \
            --set database.url=sqlite+aiosqlite:///tmp/test.db \
            --set signingKey.value=test --set credentialPepper=test \
            --set jwt.issuer=https://control.example \
            --set auth0.issuer=https://identity.example --set auth0.audience=fabric
          helm lint deploy/helm/fabric-stamp \
            --set controlPlane.url=https://control.example \
            --set controlPlane.jwtIssuer=https://control.example \
            --set enrollment.token=test --set modelHost.url=http://model-host.example
      - name: Assert production rendering
        run: bash deploy/scripts/test-production-chart.sh
      - name: Assert shared limits and usage spool packaging
        run: |
          bash deploy/scripts/test-shared-limits-chart.sh
          bash deploy/scripts/test-usage-spool-chart.sh
      - name: Assert console and native stamp exposure packaging
        run: |
          python deploy/scripts/test_console_chart.py
          python deploy/scripts/test_cache_chart.py
          bash deploy/scripts/test-stamp-exposure-chart.sh
      - name: Verify upgrades from legacy release values
        run: python deploy/scripts/test_upgrade_automation.py
