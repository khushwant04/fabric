[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fabric-control-plane"
version = "0.1.0"
description = "Fabric control-plane API: accounts, credentials, deployments, and inference stamps."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "pyjwt[crypto]==2.10.1",
  "cryptography==44.0.0",
  "httpx==0.28.1",
  "greenlet==3.1.1",
  "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "aiosqlite==0.20.0",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI dependency injection requires calls such as Depends()/Path() in
# parameter defaults, which B008 would otherwise flag.
ignore = ["B008"]
