[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "fabric-control-plane"
version = "0.1.0"
description = "Fabric control-plane API: accounts, credentials, deployments, and inference stamps."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "redis==8.1.0",
  "greenlet==3.5.6",
  "python-json-logger==4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "aiosqlite==0.22.1",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI dependency injection requires calls such as Depends()/Path() in
# parameter defaults, which B008 would otherwise flag.
ignore = ["B008"]
